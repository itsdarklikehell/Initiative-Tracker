<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline - The DM's Toolbox</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link href="/css/site.css" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/images/dndFavicon (2).png" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #1a1a2e;
      color: #eafff7;
    }
    .offline-card {
      text-align: center;
      padding: 3rem;
      max-width: 500px;
    }
    .offline-card i {
      font-size: 4rem;
      color: #e2c957;
      margin-bottom: 1rem;
    }
    .offline-card h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .offline-card p {
      color: #adb5bd;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <i class="bi bi-wifi-off"></i>
    <h1>You're Offline</h1>
    <p>The DM's Toolbox needs an internet connection to load some resources. Your saved data is still available locally.</p>
    <button class="btn btn-primary btn-lg" onclick="window.location.reload()">
      <i class="bi bi-arrow-clockwise me-2"></i>Try Again
    </button>
  </div>
</body>
</html>
